<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Box Breakout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <button id="mute-btn" onclick="toggleMute()">🔊</button>
            <div id="hud">
                <div id="peek-warning" style="display:none;">⚠️ CHILD IS WAKING UP! ⚠️</div>
                <div id="peek-active" style="display:none;">👁️ DON'T MOVE! 👁️</div>
            </div>
            <div id="start-screen" class="menu">
                <h1>Toy Box Breakout</h1>
                <p>You are a lost plushie. Get back to the toy box!</p>
                <p><strong>Controls:</strong> Arrow Keys to Move/Jump. <strong>Z</strong> to Attack.</p>
                <button onclick="startGame()">Start Game</button>
            </div>
            <div id="game-over-screen" class="menu" style="display:none;">
                <h1>CAUGHT!</h1>
                <button onclick="restartLevel()">Try Again</button>
                <button onclick="fullRestart()" style="background-color: #ff5555;">Restart Game</button>
            </div>
            <div id="victory-screen" class="menu" style="display:none;">
                <h1>SAFE!</h1>
                <button onclick="fullRestart()">Play Again</button>
            </div>
        </div>
    </div>
    <audio id="bgMusic" loop><source src="background-music.mp3" type="audio/mp3"></audio>
    <audio id="heartbeat" loop><source src="peeking.mp3" type="audio/mpeg"></audio>
    <script src="script.js"></script>
</body>
</html>
